<!DOCTYPE html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Browse Trading Cards</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel='stylesheet' href='style.css'>
</head>

<body class="p-3">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1>Trading Card Database</h1>
                <hr>
                <h3>Links</h3>
                <a href="insert.html">Insert</a>
                <a href="edit.html">Edit</a>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row mb-6">
            <div class="col-md-12">
                <h1>Browse Cards</h1>
                <hr />

                <div id="errorMessage" class="text-danger mb-3"></div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Card IP</label></div>
                    <div class='col-md-10'>
                        <select id='cardIP' class="form-select">
                            <option value="">Any</option>
                            <option value='Pokemon'>Pokemon</option>
                            <option value='Magic: The Gathering'>Magic: The Gathering</option>
                            <option value='Riftbound'>Riftbound</option>
                        </select>
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Set Name</label></div>
                    <div class='col-md-10'>
                        <input id='setID' class="form-control" type='text' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Card Name</label></div>
                    <div class='col-md-10'>
                        <input id='cardName' class="form-control" type='text' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Rarity</label></div>
                    <div class='col-md-10'>
                        <input id='rarity' class="form-control" type='text' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Is Hit?</label></div>
                    <div class='col-md-10'>
                        <input id='hit' type='checkbox' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Artist Name</label></div>
                    <div class='col-md-10'>
                        <input id='artistName' class="form-control" type='text' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Release Year</label></div>
                    <div class='col-md-10'>
                        <input id='date' class="form-control" type='number' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Limit</label></div>
                    <div class='col-md-10'>
                        <select id='limit' class="form-select">
                            <option value=''>No Limit</option>
                            <option value='10'>10</option>
                            <option value='25'>25</option>
                            <option value='50'>50</option>
                            <option value='100'>100</option>
                        </select>
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-12'>
                        <button id='search' class="btn btn-primary">Find Card(s)</button>
                    </div>
                </div>

                <hr />

                <div id='cards'>Card(s) go here.</div>
            </div>
        </div>
    </div>

    <script>
        async function fetchCards() {
            const cardsDiv = document.getElementById('cards');
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.textContent = "";
            cardsDiv.innerHTML = "Loading...";

            const params = {
                set_ip: document.getElementById('cardIP').value || undefined,
                set_id: document.getElementById('setID').value.trim() || undefined,
                card_name: document.getElementById('cardName').value.trim() || undefined,
                card_rarity: document.getElementById('rarity').value.trim() || undefined,
                is_hit: document.getElementById('hit').checked ? 1 : undefined,
                card_artist_name: document.getElementById('artistName').value.trim() || undefined,
                release_date_year: document.getElementById('date').value || undefined,
                limit: document.getElementById('limit').value || undefined
            };

            Object.keys(params).forEach(k => {
                if (params[k] === undefined || params[k] === "") delete params[k];
            });

            try {
                const query = new URLSearchParams(params).toString();
                const url = query ? `/cards?${query}` : `/cards`;

                const response = await fetch(url);

                const contentType = response.headers.get("content-type");

                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text);
                }

                if (!contentType || !contentType.includes("application/json")) {
                    const text = await response.text();
                    throw new Error("Server did not return JSON: " + text);
                }

                const json = await response.json();

                let html = `
                    <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>IP</th>
                            <th>Set Name</th>
                            <th>Card Name</th>
                            <th>Rarity</th>
                            <th>Hit</th>
                            <th>Artist</th>
                            <th>Year</th>
                        </tr>
                    </thead>
                    <tbody>
                `;

                if (json.data.length) {
                    json.data.forEach(r => {
                        html += `
                        <tr>
                            <td>${r.set_ip ?? ""}</td>
                            <td>${r.set_id ?? ""}</td>
                            <td>${r.card_name ?? ""}</td>
                            <td>${r.card_rarity ?? ""}</td>
                            <td>${r.is_hit ? "Yes" : "No"}</td>
                            <td>${r.card_artist_name ?? ""}</td>
                            <td>${r.release_date_year ?? ""}</td>
                        </tr>`;
                    });
                } else {
                    html += `<tr><td colspan="7">No cards found</td></tr>`;
                }

                html += "</tbody></table>";
                cardsDiv.innerHTML = html;

            } catch (err) {
                console.error(err);
                cardsDiv.innerHTML = "";
                errorDiv.textContent = err.message;
            }
        }

        document.getElementById('search').addEventListener('click', fetchCards);
    </script>

</body>

</html>
