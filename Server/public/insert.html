<!DOCTYPE html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Insert New Trading Cards</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel='stylesheet' href='style.css'>
</head>

<body class="p-3">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1>Trading Card Database</h1>
                <hr>
                <h3>Links</h3>
                <a href="index.html">Browse</a>
                <a href="edit.html">Edit</a>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row mb-6">
            <div class="col-md-12">
                <h1>Add New Card</h1>
                <hr />

                <div id="insertError" class="text-danger mb-3"></div>
                <div id="insertSuccess" class="text-success mb-3"></div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Card IP</label></div>
                    <div class='col-md-10'>
                        <select id='new_cardIP' class="form-select">
                            <option value="">Any</option>
                            <option value='Pokemon'>Pokemon</option>
                            <option value='Magic: The Gathering'>Magic: The Gathering</option>
                            <option value='Riftbound'>Riftbound</option>
                        </select>
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Set Name</label></div>
                    <div class='col-md-10'>
                        <input id='new_setID' class="form-control" type='text' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Card Name</label></div>
                    <div class='col-md-10'>
                        <input id='new_cardName' class="form-control" type='text' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Rarity</label></div>
                    <div class='col-md-10'>
                        <input id='new_rarity' class="form-control" type='text' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Is Hit?</label></div>
                    <div class='col-md-10'>
                        <input id='new_hit' type='checkbox' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Artist Name</label></div>
                    <div class='col-md-10'>
                        <input id='new_artistName' class="form-control" type='text' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Release Year</label></div>
                    <div class='col-md-10'>
                        <input id='new_date' class="form-control" type='number' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-12'>
                        <button id='insert' class="btn btn-success">Add Card to List</button>
                    </div>
                </div>

                <hr />

                <div id='cards'>Card(s) go here.</div>
            </div>
        </div>
    </div>



    <script>
        async function insertCard() {
            const errorDiv = document.getElementById('insertError');
            const successDiv = document.getElementById('insertSuccess');

            errorDiv.textContent = "";
            successDiv.textContent = "";

            const data = {
                set_ip: document.getElementById('new_cardIP').value,
                set_id: document.getElementById('new_setID').value.trim(),
                card_name: document.getElementById('new_cardName').value.trim(),
                card_rarity: document.getElementById('new_rarity').value.trim(),
                is_hit: document.getElementById('new_hit').checked ? 1 : 0,
                card_artist_name: document.getElementById('new_artistName').value.trim(),
                release_date_year: document.getElementById('new_date').value
            };

            try {
                const response = await fetch("/cards/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.errors?.join(", ") || "Insert failed");
                }

                successDiv.textContent = "Card added successfully!";
            } catch (err) {
                errorDiv.textContent = err.message;
            }
        }

        document.getElementById('insert').addEventListener('click', insertCard);
    </script>
</body>
