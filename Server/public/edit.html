<!DOCTYPE html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Edit Trading Cards</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel='stylesheet' href='style.css'>
</head>

<body class="p-3">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1>Trading Card Database</h1>
                <hr>
                <h3>Links</h3>
                <a href="index.html">Browse</a>
                <a href="insert.html">Insert</a>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row mb-6">
            <div class="col-md-12">
                <h1>Edit Card</h1>
                <hr />

                <div id="editError" class="text-danger mb-3"></div>
                <div id="editSuccess" class="text-success mb-3"></div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Search Card</label></div>
                    <div class='col-md-8'>
                        <input id='search_cardName' class="form-control" type='text' placeholder="Enter card name" />
                    </div>
                    <div class='col-md-2'>
                        <button class="btn btn-secondary w-100" onclick="loadCardByName()">Load</button>
                    </div>
                </div>

                <hr>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Card IP</label></div>
                    <div class='col-md-10'>
                        <select id='new_cardIP' class="form-select">
                            <option value="">Any</option>
                            <option value='Pokemon'>Pokemon</option>
                            <option value='Magic: The Gathering'>Magic: The Gathering</option>
                            <option value='Riftbound'>Riftbound</option>
                        </select>
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Set Name</label></div>
                    <div class='col-md-10'>
                        <input id='new_setID' class="form-control" type='text' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Card Name</label></div>
                    <div class='col-md-10'>
                        <input id='new_cardName' class="form-control" type='text' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Rarity</label></div>
                    <div class='col-md-10'>
                        <input id='new_rarity' class="form-control" type='text' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Is Hit?</label></div>
                    <div class='col-md-10'>
                        <input id='new_hit' type='checkbox' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Artist Name</label></div>
                    <div class='col-md-10'>
                        <input id='new_artistName' class="form-control" type='text' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-2'><label>Release Year</label></div>
                    <div class='col-md-10'>
                        <input id='new_date' class="form-control" type='number' />
                    </div>
                </div>

                <div class='row mb-3'>
                    <div class='col-md-12'>
                        <button id="updateBtn" class="btn btn-primary" onclick="editCardFromURL()">Update Card</button>
                    </div>
                </div>

                <hr />

                <div id='cards'>Card(s) go here.</div>
            </div>
        </div>
    </div>

    <script>
        async function loadCardByName() {
            const name = document.getElementById('search_cardName').value.trim();
            const errorDiv = document.getElementById('editError');
            const successDiv = document.getElementById('editSuccess');

            errorDiv.innerText = "";
            successDiv.innerText = "";

            if (!name) {
                errorDiv.innerText = "Enter a card name to search";
                return;
            }

            try {
                const response = await fetch(`/cards?card_name=${encodeURIComponent(name)}`);

                if (!response.ok) {
                    throw new Error("Search failed");
                }

                const json = await response.json();

                const card = json.data?.[0];

                if (!card) {
                    throw new Error("Card not found");
                }

                document.getElementById('new_cardIP').value = card.set_ip || "";
                document.getElementById('new_setID').value = card.set_id || "";
                document.getElementById('new_cardName').value = card.card_name || "";
                document.getElementById('new_rarity').value = card.rarity || "";
                document.getElementById('new_hit').checked = card.is_hit == 1;
                document.getElementById('new_artistName').value = card.artist_name || "";
                document.getElementById('new_date').value = card.release_year || "";

                const newURL = `${window.location.pathname}?id=${card.id}`;
                window.history.replaceState(null, "", newURL);

                successDiv.innerText = "Card loaded successfully!";

            } catch (err) {
                errorDiv.innerText = err.message;
            }
        }
        function getIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function editCardFromURL() {
            const id = getIdFromURL();

            if (!id) {
                document.getElementById('editError').innerText = "No card ID in URL";
                return;
            }

            editCard(id);
        }

        async function editCard(id) {
            const errorDiv = document.getElementById('editError');
            const successDiv = document.getElementById('editSuccess');
            const button = document.getElementById('updateBtn');
            errorDiv.innerText = "";
            successDiv.innerText = "";

            const cardName = document.getElementById('new_cardName').value.trim();
            const setID = document.getElementById('new_setID').value.trim();
            const year = document.getElementById('new_date').value;

            if (!document.getElementById('new_cardIP').value) {
                errorDiv.innerText = "Please select a Card IP";
                return;
            }

            if (!cardName) {
                errorDiv.innerText = "Card name is required";
                return;
            }

            if (!setID || isNaN(setID)) {
                errorDiv.innerText = "Set ID must be a valid number";
                return;
            }

            if (year && (year < 1900 || year > new Date().getFullYear())) {
                errorDiv.innerText = "Enter a valid release year";
                return;
            }

            try {
                button.disabled = true;

                const response = await fetch(`/cards/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        set_ip: document.getElementById('new_setIP').value,
                        set_id: document.getElementById('new_setID').value,
                        card_name: cardName.getElementById('new_cardName').value,
                        rarity: document.getElementById('new_rarity').value,
                        is_hit: document.getElementById('new_hit').checked ? 1 : 0,
                        artist_name: document.getElementById('new_artistName').value,
                        release_year: year || null
                    })
                });

                const result = await response.text();

                if (!response.ok) {
                    throw new Error(result || 'Failed to update card');
                }

                successDiv.innerText = result || "Card updated successfully!";
                errorDiv.innerText = "";

            } catch (err) {
                errorDiv.innerText = err.message;
                successDiv.innerText = "";
            } finally {
                // Re-enable button
                button.disabled = false;
            }
        }

        window.onload = async function () {
            const id = getIdFromURL();
            if (!id) return;

            try {
                const response = await fetch(`/cards/${id}`);

                if (!response.ok) {
                    throw new Error("Failed to load card");
                }

                const json = await response.json();

                const card = json.data;

                if (!card) {
                    throw new Error("Card not found");
                }

                document.getElementById('new_cardIP').value = card.set_ip || "";
                document.getElementById('new_setID').value = card.set_id || "";
                document.getElementById('new_cardName').value = card.card_name || "";
                document.getElementById('new_rarity').value = card.card_rarity || "";
                document.getElementById('new_hit').checked = card.is_hit == 1;
                document.getElementById('new_artistName').value = card.card_artist_name || "";
                document.getElementById('new_date').value = card.release_date_year || "";

            } catch (err) {
                document.getElementById('editError').innerText = err.message;
            }
        };
    </script>
</body>
